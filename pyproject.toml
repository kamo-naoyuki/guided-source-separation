[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gss-frontend"
version = "0.1.0"
description = "Minimal NeMo-free GSS front-end for single-utterance speech enhancement"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
]

[project.scripts]
gss-enhance = "gss_frontend._cli:main"
gss-diarize = "gss_frontend._diarization_cli:main"
gss-embed = "gss_frontend._embed_cli:main"

[project.optional-dependencies]
diarization = [
    "meeteval",
    "pyannote.audio",
    "dover-lap",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
plugins = []

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '/(\.git|\.hg|\.mypy_cache|\.tox|\.venv|_build|buck-out|build|dist)/'

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["gss_frontend"]


[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gss-frontend"
version = "0.1.0"
description = "Minimal NeMo-free GSS front-end for single-utterance speech enhancement"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
]

[project.scripts]
gss-enhance = "gss_frontend._cli:main"
gss-diarize = "gss_frontend._multichannel_diarization_cli:main"
gss-embed = "gss_frontend._embed_cli:main"

[project.optional-dependencies]
diarization = [
    "meeteval",
    "pyannote.audio",
    "dover-lap",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

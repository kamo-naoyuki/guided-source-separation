name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest meeteval

      - name: Run tests
        env:
          TORCHAUDIO_USE_BACKENDS_MATCHING_PHONEME_ALIGNMENT: 0
        run: python -m pytest tests/ -v